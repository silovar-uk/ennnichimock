name: Expand site package

on:
  push:
    branches:
      - agent/implement-ai-improvements

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand packaged site
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f .package/package-00 ]; then
            echo "Package already expanded; nothing to do."
            exit 0
          fi
          cat .package/package-* | base64 --decode > /tmp/ennnichi-site.tar.gz
          tar -xzf /tmp/ennnichi-site.tar.gz -C .
          rm -rf .package
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply AI improvement package"
          git push
