<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="yagura" viewBox="0 0 200 160">
      <!-- 屋根 -->
      <path d="M20 46 L100 10 L180 46 Z" fill="currentColor" opacity="0.9"/>
      <path d="M8 52 L100 14 L192 52 L182 56 L100 22 L18 56 Z" fill="currentColor"/>
      <!-- 上層欄干 -->
      <rect x="46" y="52" width="108" height="10" fill="currentColor" opacity="0.8"/>
      <g stroke="currentColor" stroke-width="3" opacity="0.7">
        <line x1="54" y1="52" x2="54" y2="62"/>
        <line x1="70" y1="52" x2="70" y2="62"/>
        <line x1="86" y1="52" x2="86" y2="62"/>
        <line x1="100" y1="52" x2="100" y2="62"/>
        <line x1="114" y1="52" x2="114" y2="62"/>
        <line x1="130" y1="52" x2="130" y2="62"/>
        <line x1="146" y1="52" x2="146" y2="62"/>
      </g>
      <!-- 提灯の列（屋根から下がる） -->
      <g opacity="0.85">
        <ellipse cx="60" cy="70" rx="6" ry="8" fill="currentColor"/>
        <ellipse cx="100" cy="72" rx="6" ry="8" fill="currentColor"/>
        <ellipse cx="140" cy="70" rx="6" ry="8" fill="currentColor"/>
      </g>
      <!-- 支柱 -->
      <rect x="56" y="62" width="6" height="86" fill="currentColor" opacity="0.8"/>
      <rect x="138" y="62" width="6" height="86" fill="currentColor" opacity="0.8"/>
      <rect x="97" y="62" width="6" height="86" fill="currentColor" opacity="0.55"/>
      <!-- 筋交い -->
      <g stroke="currentColor" stroke-width="3" opacity="0.5">
        <line x1="59" y1="70" x2="140" y2="140"/>
        <line x1="141" y1="70" x2="60" y2="140"/>
      </g>
      <!-- 基壇 -->
      <rect x="40" y="148" width="120" height="8" fill="currentColor" opacity="0.9"/>
    </symbol>
  </defs>
</svg>
